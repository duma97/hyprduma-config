# Fallback lock screen when the optional Caelestia shell is unavailable.
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(16161e)
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    outer_color = rgb(bb9af7)
    inner_color = rgb(24283b)
    font_color = rgb(c0caf5)
    check_color = rgb(7aa2f7)
    fail_color = rgb(f7768e)
    font_family = Monospace
    placeholder_text = Password
    fail_text = $PAMFAIL
    fade_on_empty = false
    rounding = 12
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(c0caf5)
    font_size = 64
    font_family = Monospace
    position = 0, 100
    halign = center
    valign = center
}
